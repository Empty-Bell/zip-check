# =============================================================================
# 수집 대상 설정
# -----------------------------------------------------------------------------
# 지역(읍/면/동) 단위로 수집합니다. 각 동의 cortarNo(법정동 코드)를 지정하면
# 해당 동의 모든 아파트 단지를 수집합니다.
# cortarNo는 data/cortarNo.csv 에서 찾을 수 있습니다.
#
# 새 동을 추가하려면 아래 regions 목록에 항목을 추가하기만 하면 됩니다.
# =============================================================================

regions:
  - name: "수원시 영통구 이의동"
    cortarNo: "4111710300"
  - name: "수원시 영통구 하동"
    cortarNo: "4111710400"

options:
  # 네이버 API 요청 사이 지연(초) — 과도한 요청으로 인한 차단 방지
  request_delay_sec: 0.3
