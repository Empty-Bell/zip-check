<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>집착 - 아파트를 째려보다</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <header>
    <h1>🏠 <span class="red">집</span><span class="red">착</span> :
      원하는 <span class="red">집</span>에 정<span class="red">착</span>하는 그날까지</h1>
    <p class="caption">갈아타고 싶은 아파트의 실거래와 매물을 좀더 딥하게 째려보자!</p>
    <p id="updated" class="updated"></p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>아파트 단지 선택</h2>
      <div class="apt-block">
        <h3>아파트 1</h3>
        <select id="sido_1"></select>
        <select id="sigungu_1"></select>
        <select id="dong_1"></select>
        <select id="complex_1"></select>
        <select id="pyeong_1"></select>
      </div>
      <div class="apt-block">
        <h3>아파트 2</h3>
        <select id="sido_2"></select>
        <select id="sigungu_2"></select>
        <select id="dong_2"></select>
        <select id="complex_2"></select>
        <select id="pyeong_2"></select>
      </div>
      <button id="run" class="primary">분석 실행</button>
    </aside>

    <main id="content">
      <p class="info">아파트 1과 아파트 2의 단지·평형을 모두 선택한 뒤 '분석 실행'을 눌러주세요.</p>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
