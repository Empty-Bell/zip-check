name: 데이터 수집 (주간)

on:
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # docs/data 커밋 푸시
  issues: write     # 수집 실패 시 알림 이슈 생성

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # --- 네이버 비공개 API 인증값 (저장소 Secrets에 등록) ---
      NNB: ${{ secrets.NNB }}
      ASID: ${{ secrets.ASID }}
      NAC: ${{ secrets.NAC }}
      AUTHORIZATION: ${{ secrets.AUTHORIZATION }}
      USER_AGENT: ${{ secrets.USER_AGENT }}
      SELL_AUTHORIZATION: ${{ secrets.SELL_AUTHORIZATION }}
      SELL_REALESTATE: ${{ secrets.SELL_REALESTATE }}
      SELL_FWB: ${{ secrets.SELL_FWB }}
      SELL_SHOW_FIN_BADGE: ${{ secrets.SELL_SHOW_FIN_BADGE }}
      SELL_GA: ${{ secrets.SELL_GA }}
      SELL_GA_0ZGH3YC3W6: ${{ secrets.SELL_GA_0ZGH3YC3W6 }}
      SELL_REFERER: ${{ secrets.SELL_REFERER }}
      SCHOOL_AUTHORIZATION: ${{ secrets.SCHOOL_AUTHORIZATION }}
      SCHOOL_PAGE_UID: ${{ secrets.SCHOOL_PAGE_UID }}
      SCHOOL_REALESTATE: ${{ secrets.SCHOOL_REALESTATE }}
      SCHOOL_SRT30: ${{ secrets.SCHOOL_SRT30 }}
      SCHOOL_SRT5: ${{ secrets.SCHOOL_SRT5 }}
      SCHOOL_BUC: ${{ secrets.SCHOOL_BUC }}
      DONG_AUTHORIZATION: ${{ secrets.DONG_AUTHORIZATION }}
      DONG_PAGE_UID: ${{ secrets.DONG_PAGE_UID }}
      DONG_REALESTATE: ${{ secrets.DONG_REALESTATE }}
      DONG_SRT30: ${{ secrets.DONG_SRT30 }}
      DONG_SRT5: ${{ secrets.DONG_SRT5 }}
      DONG_BUC: ${{ secrets.DONG_BUC }}
      BUILDING_AUTHORIZATION: ${{ secrets.BUILDING_AUTHORIZATION }}
      BUILDING_PAGE_UID: ${{ secrets.BUILDING_PAGE_UID }}
      BUILDING_REALESTATE: ${{ secrets.BUILDING_REALESTATE }}
      BUILDING_SRT30: ${{ secrets.BUILDING_SRT30 }}
      BUILDING_SRT5: ${{ secrets.BUILDING_SRT5 }}
      BUILDING_BUC: ${{ secrets.BUILDING_BUC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 및 JSON 빌드
        run: python -m collector.collect

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "data: 주간 시세 갱신 ($(date +%Y-%m-%d))"
            git push
          fi

      - name: 실패 시 알림 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `데이터 수집 실패 (${new Date().toISOString().slice(0,10)})`;
            const body = [
              '주간 데이터 수집 워크플로가 실패했습니다.',
              '',
              '가장 흔한 원인은 **네이버 API 세션 토큰 만료**입니다.',
              '브라우저에서 토큰을 다시 추출해 저장소 Secrets를 갱신한 뒤,',
              'Actions 탭에서 워크플로를 수동 재실행(Run workflow)하세요.',
              '',
              `실패 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-collection']
            });
