name: 데이터 수집 (주간)

on:
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # docs/data 커밋 푸시
  issues: write     # 수집 실패 시 알림 이슈 생성

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # --- 네이버 비공개 API 인증값 (저장소 Secrets에 등록, 5개) ---
      AUTHORIZATION: ${{ secrets.AUTHORIZATION }}
      NNB: ${{ secrets.NNB }}
      ASID: ${{ secrets.ASID }}
      NAC: ${{ secrets.NAC }}
      USER_AGENT: ${{ secrets.USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 및 JSON 빌드
        run: python -m collector.collect

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "data: 주간 시세 갱신 ($(date +%Y-%m-%d))"
            git push
          fi

      - name: 실패 시 알림 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `데이터 수집 실패 (${new Date().toISOString().slice(0,10)})`;
            const body = [
              '주간 데이터 수집 워크플로가 실패했습니다.',
              '',
              '가장 흔한 원인은 **네이버 API 세션 토큰 만료**입니다.',
              '브라우저에서 토큰을 다시 추출해 저장소 Secrets를 갱신한 뒤,',
              'Actions 탭에서 워크플로를 수동 재실행(Run workflow)하세요.',
              '',
              `실패 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-collection']
            });
